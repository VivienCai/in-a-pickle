<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>In A Pickle</title>
        <style>
            :root {
                font-family: "Trebuchet MS", system-ui, sans-serif;
                color: #1f3020;
                background: #f6d35e;
            }

            body {
                display: grid;
                place-items: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f6d35e;
                background-image: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.18) 25%,
                    transparent 25% 50%,
                    rgba(255, 255, 255, 0.18) 50% 75%,
                    transparent 75%
                );
                background-size: 42px 42px;
            }

            main {
                width: min(430px, calc(100% - 32px));
                position: relative;
                padding: 34px 32px 28px;
                background: #fff8df;
                border: 3px solid #1f3020;
                border-radius: 10px 4px 12px 6px;
                box-shadow: 10px 11px 0 #1f3020;
            }

            h1 {
                margin: 0;
                color: #4b842f;
                font-size: clamp(2.4rem, 11vw, 3.4rem);
                line-height: 0.88;
                letter-spacing: -0.08em;
                text-transform: uppercase;
                text-shadow: 3px 3px 0 #f0bd3d;
            }

            h2 {
                margin-bottom: 8px;
                color: #d8523b;
                font-size: 1.1rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            p {
                max-width: 265px;
                font-weight: 700;
                color: #526141;
            }

            form {
                display: grid;
                gap: 10px;
                margin: 22px 0;
            }

            input,
            button {
                box-sizing: border-box;
                width: 100%;
                padding: 13px;
                font: inherit;
                border: 2px solid #1f3020;
                border-radius: 5px;
            }

            input {
                color: #1f3020;
                background: #fffdf2;
            }

            input:focus {
                outline: 3px solid #f0bd3d;
                outline-offset: 2px;
            }

            button {
                cursor: pointer;
                color: #1f3020;
                background: #9dcc5a;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 0.02em;
                box-shadow: 0 4px 0 #1f3020;
            }

            button:hover {
                background: #b5df70;
            }
            button:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 #1f3020;
            }

            .room {
                padding: 16px;
                background: #e3f0b9;
                border: 2px dashed #4b842f;
                border-radius: 5px 10px 6px 8px;
                box-shadow: 5px 5px 0 #d8523b;
            }

            #room-code {
                color: #d8523b;
                font-size: 1.8rem;
                letter-spacing: 0.15em;
            }
            #status {
                min-height: 1.5em;
            }
            ul {
                padding-left: 20px;
            }
            .hidden {
                display: none;
            }
            #disconnect-actions {
                margin-top: 20px;
            }
            #disconnect-actions button + button {
                margin-top: 10px;
                background: #f0bd3d;
            }
            #rejoin-prompt {
                margin-bottom: 22px;
                padding: 16px;
                background: #e3f0b9;
                border: 2px dashed #4b842f;
                border-radius: 5px 10px 6px 8px;
            }
            #rejoin-prompt p {
                margin-top: 0;
            }
            #rejoin-prompt button + button {
                margin-top: 10px;
                background: #f0bd3d;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>In A Pickle</h1>

            <section id="entry">
                <form id="create-form">
                    <h2>Create a room</h2>
                    <input
                        id="create-name"
                        maxlength="24"
                        placeholder="Your name"
                        required
                    />
                    <button type="submit">Create Room</button>
                </form>

                <form id="join-form">
                    <h2>Join a room</h2>
                    <input
                        id="join-name"
                        maxlength="24"
                        placeholder="Your name"
                        required
                    />
                    <input
                        id="join-code"
                        maxlength="4"
                        placeholder="Room code"
                        required
                    />
                    <button type="submit">Join Room</button>
                </form>
            </section>

            <section id="rejoin-prompt" class="hidden">
                <h2>Welcome back</h2>
                <p>
                    You were last in room
                    <strong id="rejoin-code"></strong>
                </p>
                <button id="rejoin-yes" type="button">Rejoin Room</button>
            </section>

            <section id="lobby" class="hidden">
                <div class="room">
                    Room code: <strong id="room-code"></strong>
                </div>
                <h2>Players</h2>
                <ul id="players"></ul>
                <div id="disconnect-actions" class="hidden">
                    <p>You disconnected from this room.</p>
                    <button id="rejoin-button" type="button">
                        Rejoin Room
                    </button>
                    <button id="new-room-button" type="button">
                        Join a New Room
                    </button>
                </div>
            </section>

            <p id="status"></p>
        </main>
        <script src="/app.js"></script>
    </body>
</html>
